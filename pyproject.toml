[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vidcompress"
version = "0.1.2"
description = "Local video compression powered by WebCodecs — hardware-accelerated, zero FFmpeg required"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "Arpan Tripathi" }]
keywords = ["video", "compression", "webcodecs", "transcoding", "local"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Topic :: Multimedia :: Video :: Conversion",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]
dependencies = [
    "fastapi>=0.100.0",
    "uvicorn[standard]>=0.20.0",
]

[project.scripts]
vidcompress = "vidcompress.cli:main"

[project.urls]
Homepage = "https://github.com/arpantripathi/ffmpeg-compression-local"
Repository = "https://github.com/arpantripathi/ffmpeg-compression-local"
